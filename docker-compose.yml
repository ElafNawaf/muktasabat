services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muktasbat
      POSTGRES_USER: muktasbat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muktasbat_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muktasbat"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Default 8000; override with API_PORT if something else on the host already owns it.
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://muktasbat:${DB_PASSWORD:-muktasbat_secret}@db:5432/muktasbat
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # S3 / file uploads — set these in .env (or your hosting environment)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}       # leave blank for AWS; set for R2/MinIO
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}  # optional CDN prefix (e.g. CloudFront)
      # SES email
      SES_REGION: ${SES_REGION:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3001}
      # AWS credentials (shared by S3 and SES)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      # Default 3001 avoids clashing with local `npm run dev` on 3000. Use WEB_PORT=3000 when host 3000 is free.
      - "${WEB_PORT:-3001}:3000"
    environment:
      # Server-side calls go to FastAPI inside the docker network
      API_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
