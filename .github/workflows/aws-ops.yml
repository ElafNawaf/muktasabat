# Runs scripts/ops/aws_task.sh against AWS using GitHub OIDC (no stored keys).
# Role trust is limited to this repo's ops/aws and feature/public-website branches.
name: AWS ops
on:
  push:
    branches: [ops/aws]
permissions:
  id-token: write
  contents: read
concurrency:
  group: aws-ops
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::587257569063:role/muktasabat-github-deploy
          aws-region: ap-south-1
      - name: Task
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: bash scripts/ops/aws_task.sh 2>&1 | sed -E 's/([A-Za-z0-9])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\.[a-z]{2,})/\1***@\2/g'
