# Deploy muktasabat.com from GitHub — no laptop needed.
#
# Mirrors docs/DEPLOY.md: images are built HERE (never on the 1 GB Lightsail
# box), shipped with scp, loaded, tags bumped, smoke-tested, and only then is
# .last_deployed_sha updated. A failed smoke test rolls back automatically.
#
# Required repository secret:
#   LIGHTSAIL_SSH_KEY — contents of lightsail_apsouth1_default.pem
#     (Lightsail console → Account → SSH keys → download the ap-south-1 default key)
#
# Triggers: push to feature/public-website, or "Run workflow" by hand (once this
# file is on master). Add master to `branches` to deploy every merge automatically.

name: Deploy production

on:
  push:
    branches: [feature/public-website]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HOST: 13.232.25.224
  USER: ubuntu
  RUNTIME: /home/ubuntu/muktasabat

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH key secret
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret LIGHTSAIL_SSH_KEY is missing. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/lightsail.pem -o ConnectTimeout=20 -o ServerAliveInterval=15 $USER@$HOST" >> "$GITHUB_ENV"
          echo "SCP=scp -i $HOME/.ssh/lightsail.pem -o ConnectTimeout=20" >> "$GITHUB_ENV"

      - name: Read current production state
        run: |
          $SSH true
          LAST_SHA=$($SSH "cat $RUNTIME/.last_deployed_sha" || echo unknown)
          CUR_API=$($SSH "grep 'image: muktasabat-api:' $RUNTIME/docker-compose.yml | sed -E 's/.*v([0-9]+).*/\1/'")
          CUR_WEB=$($SSH "grep 'image: muktasabat-web:' $RUNTIME/docker-compose.yml | sed -E 's/.*v([0-9]+).*/\1/'")
          echo "LAST_SHA=$LAST_SHA" >> "$GITHUB_ENV"
          echo "CUR_API=$CUR_API" >> "$GITHUB_ENV"; echo "NEW_API=$((CUR_API + 1))" >> "$GITHUB_ENV"
          echo "CUR_WEB=$CUR_WEB" >> "$GITHUB_ENV"; echo "NEW_WEB=$((CUR_WEB + 1))" >> "$GITHUB_ENV"
          echo "prod $LAST_SHA → $GITHUB_SHA | api v$CUR_API→v$((CUR_API+1)) web v$CUR_WEB→v$((CUR_WEB+1))"

      - name: Build images (linux/amd64, on the runner)
        run: |
          docker build -t muktasabat-api:v$NEW_API .
          docker build \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            -t muktasabat-web:v$NEW_WEB -f web/Dockerfile web/
          docker save muktasabat-api:v$NEW_API | gzip -1 > api.tar.gz
          docker save muktasabat-web:v$NEW_WEB | gzip -1 > web.tar.gz
          ls -lh *.tar.gz

      - name: Free disk space on the server
        # Every release leaves two images on the small Lightsail disk; without
        # cleanup "docker load" eventually fails with "no space left on device".
        # Keeps the running version (needed for rollback) and the one before it.
        run: |
          $SSH "KEEP_API=$CUR_API KEEP_WEB=$CUR_WEB bash -s" <<'REMOTE'
          set -u
          rm -f /home/ubuntu/api.tar.gz /home/ubuntu/web.tar.gz
          echo "before:"; df -h / | tail -1
          prune() {
            repo=$1; keep=$2
            for t in $(docker images "$repo" --format '{{.Tag}}'); do
              v=${t#v}
              case "$v" in ''|*[!0-9]*) continue;; esac
              if [ "$v" -lt $((keep - 1)) ]; then docker rmi "$repo:$t" >/dev/null 2>&1 && echo "removed $repo:$t" || true; fi
            done
          }
          prune muktasabat-api "$KEEP_API"
          prune muktasabat-web "$KEEP_WEB"
          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1
          REMOTE

      - name: Ship and load
        run: |
          $SCP api.tar.gz web.tar.gz $USER@$HOST:/home/ubuntu/
          $SSH "set -e
            gunzip -c /home/ubuntu/api.tar.gz | docker load
            gunzip -c /home/ubuntu/web.tar.gz | docker load
            rm -f /home/ubuntu/api.tar.gz /home/ubuntu/web.tar.gz"

      - name: Ensure runtime config (idempotent)
        # Persistent upload volume + settings the release needs. Backs up both
        # files, validates with `docker compose config`, restores on failure.
        run: |
          $SSH 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/muktasabat
          ts=$(date +%Y%m%d%H%M%S)
          cp docker-compose.yml docker-compose.yml.bak-$ts
          cp .env .env.bak-$ts
          mkdir -p uploads
          setenv() { grep -qE "^$1=" .env || echo "$1=$2" >> .env; }
          setenv LOCAL_UPLOAD_DIR /app/uploads
          setenv STORAGE_FALLBACK_LOCAL 1
          setenv API_PUBLIC_BASE_URL https://muktasabat.com
          setenv S3_PUBLIC_BASE_URL https://muktasabat.com/uploads
          setenv DISABLE_BOOTSTRAP_ADMIN 1
          grep -qE '^REVALIDATE_SECRET=' .env || echo "REVALIDATE_SECRET=$(openssl rand -hex 24)" >> .env
          if ! grep -q '/app/uploads' docker-compose.yml; then
            sed -i '0,/^    env_file: .env$/s//    env_file: .env\n    volumes:\n      - .\/uploads:\/app\/uploads/' docker-compose.yml
          fi
          if ! grep -q 'REVALIDATE_SECRET' docker-compose.yml; then
            sed -i '0,/^      NODE_ENV: production$/s//      NODE_ENV: production\n      REVALIDATE_SECRET: ${REVALIDATE_SECRET}/' docker-compose.yml
          fi
          if docker compose config -q; then
            echo "runtime config OK"; grep -n -A2 'volumes:' docker-compose.yml | head -4
          else
            echo "compose invalid — restoring backup"; cp docker-compose.yml.bak-$ts docker-compose.yml; cp .env.bak-$ts .env; exit 1
          fi
          REMOTE

      - name: Support inbox (SUPPORT_EMAIL)
        # Inbox for new support-ticket alerts. Kept in the repository secret
        # SUPPORT_EMAIL (not in this public file); set or replaced in the
        # runtime .env when present. Empty → alerts go to all active admins.
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          if [ -z "$SUPPORT_EMAIL" ]; then echo "SUPPORT_EMAIL secret not set — leaving .env unchanged"; exit 0; fi
          case "$SUPPORT_EMAIL" in *[!A-Za-z0-9@._,+-]*) echo "::error::SUPPORT_EMAIL has unexpected characters"; exit 1;; esac
          $SSH "cd $RUNTIME && cp .env .env.bak-support-\$(date +%Y%m%d%H%M%S) && \
                (grep -q '^SUPPORT_EMAIL=' .env && sed -i 's|^SUPPORT_EMAIL=.*|SUPPORT_EMAIL=$SUPPORT_EMAIL|' .env || echo 'SUPPORT_EMAIL=$SUPPORT_EMAIL' >> .env) && \
                grep -c '^SUPPORT_EMAIL=' .env"

      - name: Payment-alert Cc (PAYMENT_ALERTS_CC)
        # The CEO is Cc'd on every payment alert. Uses the PAYMENT_ALERTS_CC
        # repository secret when set; otherwise, if the runtime .env has no
        # value yet, takes the e-mail of the portal account named by the
        # repository variable CEO_USERNAME (default "nawaf"). Never overwrites
        # a value someone set on the server by hand.
        env:
          CC_SECRET: ${{ secrets.PAYMENT_ALERTS_CC }}
          CEO_USERNAME: ${{ vars.CEO_USERNAME || 'nawaf' }}
        run: |
          CC="$CC_SECRET"
          if [ -z "$CC" ]; then
            CUR=$($SSH "grep -E '^PAYMENT_ALERTS_CC=.+' $RUNTIME/.env | cut -d= -f2-" || true)
            if [ -n "$CUR" ]; then echo "PAYMENT_ALERTS_CC already set on the server — leaving it"; exit 0; fi
            case "$CEO_USERNAME" in *[!A-Za-z0-9._-]*) echo "::error::CEO_USERNAME has unexpected characters"; exit 1;; esac
            CC=$($SSH "docker exec -i muktasabat-api-1 python -c \"from sqlalchemy import select; from api.database import SessionLocal; from api.models import User; db = SessionLocal(); u = db.scalar(select(User).where(User.username == '$CEO_USERNAME', User.is_active_user.is_(True))); print(u.email if u and u.email else '')\"" | tr -d '\r' | tail -1)
          fi
          if [ -z "$CC" ]; then echo "::warning::No PAYMENT_ALERTS_CC (no secret, no active user '$CEO_USERNAME') — alerts go To the employee only"; exit 0; fi
          case "$CC" in *[!A-Za-z0-9@._,+-]*) echo "::error::PAYMENT_ALERTS_CC has unexpected characters"; exit 1;; esac
          $SSH "cd $RUNTIME && cp .env .env.bak-cc-\$(date +%Y%m%d%H%M%S) && \
                (grep -q '^PAYMENT_ALERTS_CC=' .env && sed -i 's|^PAYMENT_ALERTS_CC=.*|PAYMENT_ALERTS_CC=$CC|' .env || echo 'PAYMENT_ALERTS_CC=$CC' >> .env) && \
                grep -c '^PAYMENT_ALERTS_CC=.' .env"
          echo "PAYMENT_ALERTS_CC set (…@${CC##*@})"

      - name: Preflight — boot the new API next to the live one
        # Starts the NEW image with the live container's env + network and waits
        # for "Application startup complete". Startup runs the CMS table creation
        # and seeding against the production DB, so any crash shows up here,
        # before the live containers are touched.
        run: |
          $SSH "set -e
            NET=\$(docker inspect muktasabat-api-1 --format '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}}{{end}}')
            docker inspect muktasabat-api-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -vE '^(PATH|LANG|GPG_KEY|PYTHON_[A-Z_]+)=' > /tmp/preflight.env
            docker rm -f mk-preflight >/dev/null 2>&1 || true
            set +e
            timeout 60 docker run --name mk-preflight --rm --network \$NET --env-file /tmp/preflight.env -v $RUNTIME/uploads:/app/uploads muktasabat-api:v$NEW_API \
              uvicorn api.main:app --host 127.0.0.1 --port 8001 > /tmp/preflight.log 2>&1 &
            for i in \$(seq 1 50); do
              grep -q 'Application startup complete' /tmp/preflight.log && break
              grep -qE 'Traceback|startup failed' /tmp/preflight.log && break
              sleep 1
            done
            docker rm -f mk-preflight >/dev/null 2>&1
            rm -f /tmp/preflight.env
            cat /tmp/preflight.log
            grep -q 'Application startup complete' /tmp/preflight.log"

      - name: Swap tags and restart
        run: |
          $SSH "set -e
            cd $RUNTIME
            cp docker-compose.yml docker-compose.yml.bak-$GITHUB_RUN_ID
            sed -i 's|muktasabat-api:v$CUR_API|muktasabat-api:v$NEW_API|; s|muktasabat-web:v$CUR_WEB|muktasabat-web:v$NEW_WEB|' docker-compose.yml
            docker compose up -d
            sleep 15
            docker compose ps"

      - name: Smoke test
        id: smoke
        run: |
          FAIL=0
          for p in /en/login /ar/login /en/dashboard /ar /en /ar/services /ar/projects /ar/contact /sitemap.xml /robots.txt; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://muktasabat.com$p" || echo 000)
            printf "%-16s %s\n" "$p" "$code"
            [ "$code" = 200 ] || FAIL=1
          done
          if curl -sS --max-time 30 https://muktasabat.com/ar | grep -q 'mk-hero'; then echo "homepage: new site"; else echo "homepage: NOT the new site"; FAIL=1; fi
          if $SSH "docker logs muktasabat-api-1 --since 3m 2>&1 | grep -qiE 'Traceback|startup failed'"; then
            echo "API errors:"; $SSH "docker logs muktasabat-api-1 --since 3m 2>&1 | grep -v '\"level\": \"INFO\"' | tail -80"; FAIL=1
          fi
          RESTARTS=$($SSH "docker inspect muktasabat-api-1 --format '{{.RestartCount}}'")
          [ "$RESTARTS" = 0 ] || { echo "API container restarted $RESTARTS time(s)"; FAIL=1; }
          [ $FAIL = 0 ]

      - name: Domain readiness (read-only)
        continue-on-error: true
        run: |
          $SSH 'bash -s' <<'REMOTE'
          echo "== Caddyfile (secrets redacted)"
          sudo sed -E 's/((basicauth|basic_auth|hash|token|secret|password|key|api_key)[^ ]*)[[:space:]]+[^ {}]+/\1 ***REDACTED***/I' /etc/caddy/Caddyfile 2>/dev/null || echo "(none)"
          ls /etc/caddy 2>/dev/null
          echo "== web service environment keys"
          cd /home/ubuntu/muktasabat && awk '/^  web:/{w=1} w&&/^  [a-z]/&&!/^  web:/{w=0} w' docker-compose.yml | sed -E 's/(:[[:space:]]*).*/\1…/' 
          echo "== URL keys in .env (names only)"
          grep -oE '^(WEB_BASE_URL|APP_PUBLIC_URL|API_PUBLIC_BASE_URL|S3_PUBLIC_BASE_URL|SITE_URL|CORS[A-Z_]*|ALLOWED[A-Z_]*)=' .env || true
          grep -E '^(WEB_BASE_URL|APP_PUBLIC_URL|API_PUBLIC_BASE_URL|S3_PUBLIC_BASE_URL|SITE_URL)=' .env | sed -E 's#=(https?://[^/]+).*#=\1#'
          echo "== DNS seen by the server"
          for d in mrc.sa www.mrc.sa muktasabat.com www.muktasabat.com mro.com.sa www.mro.com.sa; do echo "$d → $(getent ahostsv4 $d | awk 'NR==1{print $1}')"; done
          REMOTE

      - name: Short domains (mrc.sa → muktasabat.com)
        # Forwards each short domain to https://muktasabat.com, keeping the path.
        # A domain is only added once its DNS points at this server, so nothing
        # breaks before the DNS change; certificates come from Let's Encrypt.
        # Never fails the deploy.
        if: success()
        continue-on-error: true
        env:
          SHORT_DOMAINS: "mrc.sa www.mrc.sa"
        run: |
          $SSH "HOST_IP=$HOST SHORT_DOMAINS='$SHORT_DOMAINS' bash -s" <<'REMOTE'
          set -u
          if [ -f /etc/caddy/Caddyfile ]; then echo "Web proxy on host: Caddy"; elif command -v nginx >/dev/null 2>&1; then echo "Web proxy on host: nginx $(nginx -v 2>&1 | sed 's/.*\///')"; else echo "Web proxy on host: unknown"; fi
          ready=""
          for d in $SHORT_DOMAINS; do
            ip=$(getent ahostsv4 "$d" 2>/dev/null | awk 'NR==1{print $1}')
            if [ "$ip" = "$HOST_IP" ]; then ready="$ready $d"; echo "DNS ok: $d"; else echo "DNS not pointing here yet: $d (${ip:-no A record})"; fi
          done
          ready=$(echo $ready)
          [ -z "$ready" ] && { echo "Nothing to do until DNS is updated."; exit 0; }

          if [ -f /etc/caddy/Caddyfile ]; then
            echo "Proxy: Caddy"
            f=/etc/caddy/Caddyfile
            sudo cp "$f" "$f.bak-short"
            sudo sed -i '/# >>> short-domains/,/# <<< short-domains/d' "$f"
            hosts=$(echo "$ready" | sed 's/ /, /g')
            printf '\n# >>> short-domains (managed by deploy)\n%s {\n\tredir https://muktasabat.com{uri} permanent\n}\n# <<< short-domains\n' "$hosts" | sudo tee -a "$f" >/dev/null
            if sudo caddy validate --config "$f" --adapter caddyfile >/dev/null 2>&1; then sudo systemctl reload caddy && echo "Caddy reloaded: $ready"; else echo "Caddy config invalid — restoring"; sudo cp "$f.bak-short" "$f"; fi
          elif command -v nginx >/dev/null 2>&1; then
            echo "Proxy: nginx"
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot python3-certbot-nginx >/dev/null || { echo "certbot install failed"; exit 0; }
            fi
            conf=/etc/nginx/sites-available/short-domains.conf
            sudo mkdir -p /var/www/letsencrypt
            # 1) plain-HTTP block so Let's Encrypt can verify the domains
            printf 'server {\n  listen 80;\n  listen [::]:80;\n  server_name %s;\n  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }\n  location / { return 301 https://muktasabat.com$request_uri; }\n}\n' "$ready" | sudo tee "$conf" >/dev/null
            sudo ln -sf "$conf" /etc/nginx/sites-enabled/short-domains.conf
            sudo nginx -t >/dev/null 2>&1 && sudo systemctl reload nginx || { echo "nginx test failed"; sudo rm -f /etc/nginx/sites-enabled/short-domains.conf; exit 0; }
            args=""; for d in $ready; do args="$args -d $d"; done
            if sudo certbot certonly --webroot -w /var/www/letsencrypt --cert-name short-domains --expand --non-interactive --agree-tos --register-unsafely-without-email $args >/tmp/certbot.log 2>&1; then
              # 2) HTTPS block with the certificate
              printf 'server {\n  listen 443 ssl http2;\n  listen [::]:443 ssl http2;\n  server_name %s;\n  ssl_certificate /etc/letsencrypt/live/short-domains/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/short-domains/privkey.pem;\n  return 301 https://muktasabat.com$request_uri;\n}\n' "$ready" | sudo tee -a "$conf" >/dev/null
              if sudo nginx -t >/dev/null 2>&1; then sudo systemctl reload nginx && echo "nginx reloaded with HTTPS for: $ready"; else echo "nginx test failed (https) — keeping HTTP only"; printf 'server {\n  listen 80;\n  listen [::]:80;\n  server_name %s;\n  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }\n  location / { return 301 https://muktasabat.com$request_uri; }\n}\n' "$ready" | sudo tee "$conf" >/dev/null; sudo nginx -t && sudo systemctl reload nginx; fi
            else
              echo "certbot failed:"; tail -5 /tmp/certbot.log
            fi
          else
            echo "No Caddy or nginx found on the host — can't add short domains automatically."
            sudo ss -ltnp 2>/dev/null | grep -E ':(80|443) ' | sed -E 's/users:.*//' || true
          fi
          REMOTE
          for d in $SHORT_DOMAINS; do
            echo "$d → $(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 https://$d/ar 2>/dev/null || echo 'not reachable over HTTPS yet')"
          done

      - name: Roll back on failure
        if: failure() && env.NEW_API != ''
        run: |
          echo "::error::Smoke test failed — rolling back to api v$CUR_API / web v$CUR_WEB"
          $SSH "cd $RUNTIME && sed -i 's|muktasabat-api:v$NEW_API|muktasabat-api:v$CUR_API|; s|muktasabat-web:v$NEW_WEB|muktasabat-web:v$CUR_WEB|' docker-compose.yml && docker compose up -d && docker compose ps"
          $SSH "docker logs muktasabat-api-1 --since 5m 2>&1 | tail -40" || true

      - name: Update deploy marker
        run: $SSH "echo $GITHUB_SHA > $RUNTIME/.last_deployed_sha"

      - name: Refresh site cache now
        run: |
          SECRET=$($SSH "grep -E '^REVALIDATE_SECRET=' $RUNTIME/.env | cut -d= -f2-")
          curl -sS -X POST -H "x-revalidate-secret: $SECRET" https://muktasabat.com/api/site/revalidate || true
          echo

      - name: Warm the website cache
        # Pages built inside Docker had no API to talk to; ISR replaces them with
        # live CMS content on the first request after the 5-minute window.
        run: |
          sleep 310
          for p in /ar /en /ar/about /en/about /ar/services /en/services /ar/projects /en/projects /ar/contact /en/contact /sitemap.xml; do
            curl -sS -o /dev/null --max-time 30 "https://muktasabat.com$p" || true
          done
          sleep 5
          curl -sS --max-time 30 https://muktasabat.com/ar | grep -q 'mk-service' && echo "CMS content live" || echo "::warning::Homepage has no services yet — check the API logs."
