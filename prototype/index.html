// so the surrounding .brand-mark maroon tile shows through.
window.BrandLogo = function BrandLogo({ size = 36 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Muktasabat">
      {/* Roof chevron — clean miter, blunt ends */}
      <path d="M14 26 L32 12 L50 26" stroke="#ffffff" strokeWidth="5" strokeLinejoin="miter" strokeLinecap="square" fill="none" />
      {/* "n"-arch: rounded top-left, sharp top-right, with rectangular cutout for the two legs */}
      <path d="M14 52 L14 36 Q14 30 20 30 L50 30 L50 52 L44 52 L44 38 L20 38 L20 52 Z" fill="#ffffff" />
      {/* Two pillars between the legs (slightly different heights, mirrors original) */}
      <rect x="24" y="40" width="6" height="12" fill="#ffffff" opacity="0.55" />
      <rect x="34" y="42" width="6" height="10" fill="#ffffff" opacity="0.55" />
    </svg>
  );
};

// Status badge
window.StatusBadge = function StatusBadge({ status, t }) {
  const map = {
    active: { cls: "badge-success", text: t.active, icon: "" },
    paid: { cls: "badge-success", text: t.paid, icon: "" },
    available: { cls: "badge-success", text: t.available, icon: "" },
    pending: { cls: "badge-neutral", text: t.pending, icon: "" },
    expired: { cls: "badge-neutral", text: t.expired, icon: "" },
    expiring: { cls: "badge-warning", text: t.expiring, icon: "" },
    overdue: { cls: "badge-danger", text: t.overdue, icon: "" },
    terminated: { cls: "badge-danger", text: t.terminated, icon: "" },
    occupied: { cls: "badge-danger", text: t.occupied, icon: "" },
  };
  const m = map[status] || { cls: "badge-neutral", text: status };
  return (
    <span className={"badge " + m.cls}>
      <span className="dot" />
      {m.text}
    </span>
  );
};

// KPI card
window.KPICard = function KPICard({ icon, label, value, suffix, trend, trendDir, variant, progress }) {
  return (
    <div className={"kpi " + (variant || "")}>
      <div className="kpi-head">
        <div className="kpi-icon"><span className="ms">{icon}</span></div>
        {trend && (
          <div className={"kpi-trend " + (trendDir || "")}>
            <span className="ms">{trendDir === "up" ? "trending_up" : trendDir === "down" ? "trending_down" : "trending_flat"}</span>
            {trend}
          </div>
        )}
      </div>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">
        {value}
        {suffix && <span style={{ fontSize: 13, fontWeight: 500, color: "var(--color-text-secondary)", marginInlineStart: 6 }}>{suffix}</span>}
      </div>
      {progress != null && (
        <div className="kpi-bar"><span style={{ width: progress + "%" }} /></div>
      )}
    </div>
  );
};

// Drawer (animated)
window.Drawer = function Drawer({ open, title, sub, onClose, children, footer, width = 540 }) {
  const [render, setRender] = useState(open);
  useEffect(() => {
    if (open) setRender(true);
    else { const t = setTimeout(() => setRender(false), 300); return () => clearTimeout(t); }
  }, [open]);
  if (!render) return null;
  return (
    <Fragment>
      <div className={"drawer-overlay" + (open ? " open" : "")} onClick={onClose} />
      <div className={"drawer" + (open ? " open" : "")} style={{ width }}>
        <div className="drawer-hd">
          <div>
            <h2>{title}</h2>
            {sub && <div className="sub">{sub}</div>}
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><span className="ms">close</span></button>
        </div>
        <div className="drawer-body">{children}</div>
        {footer && <div className="drawer-foot">{footer}</div>}
      </div>
    </Fragment>
  );
};

// Modal
window.Modal = function Modal({ open, title, sub, onClose, children, footer, width = 460 }) {
  const [render, setRender] = useState(open);
  useEffect(() => {
    if (open) setRender(true);
    else { const t = setTimeout(() => setRender(false), 220); return () => clearTimeout(t); }
  }, [open]);
  if (!render) return null;
  return (
    <div className={"modal-overlay" + (open ? " open" : "")} onClick={onClose}>
      <div className="modal" style={{ width }} onClick={e => e.stopPropagation()}>
        <div className="modal-hd">
          <h2>{title}</h2>
          {sub && <div className="sub">{sub}</div>}
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
};

// Toast manager
window.Toasts = function Toasts({ toasts }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div key={t.id} className={"toast " + (t.type || "")}>
          <span className="ms">{t.type === "error" ? "error" : t.type === "warn" ? "warning" : "check_circle"}</span>
          <div className="text">{t.text}</div>
        </div>
      ))}
    </div>
  );
};

// Toggle
window.Toggle = function Toggle({ on, onChange }) {
  return <button className={"toggle" + (on ? " on" : "")} onClick={() => onChange(!on)} aria-pressed={on} />;
};

window.Empty = function Empty({ icon = "inbox", title, sub }) {
  return (
    <div style={{ padding: 60, textAlign: "center", color: "var(--color-text-secondary)" }}>
      <div style={{ width: 48, height: 48, borderRadius: 12, background: "var(--color-bg-deep)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: 12 }}>
        <span className="ms ms-lg">{icon}</span>
      </div>
      <div style={{ fontWeight: 600, color: "var(--color-text-primary)" }}>{title}</div>
      <div style={{ fontSize: 13, marginTop: 4 }}>{sub}</div>
    </div>
  );
};

</script>

<script type="text/babel">
// Dashboard — professional, charts-first
window.DashboardScreen = function DashboardScreen() {
  const { locale, setRoute, MOCK, theme } = window.useApp();
  const t = window.useT(locale);
  const D = MOCK;
  const R = window.Recharts || {};
  const { ResponsiveContainer, AreaChart, Area, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, PieChart, Pie, Cell, LineChart, Line } = R;

  const totalUnits = D.units.length;
  const occupied = D.units.filter(u => !u.available).length;
  const available = totalUnits - occupied;
  const occRate = Math.round((occupied / totalUnits) * 100);
  const activeContracts = D.contracts.filter(c => c.status === "active" || c.status === "expiring").length;
  const overdue = D.payments.filter(p => p.status === "overdue");
  const overdueAmt = overdue.reduce((s,p) => s + p.amount, 0);
  const monthlyPotential = D.units.reduce((s,u) => s + (u.available ? 0 : u.rent), 0);
  const collectedMtd = Math.round(monthlyPotential * 0.87);
  const collectionRate = 87;
  const expiring = D.contracts.filter(c => c.status === "expiring").length;

  // Synthetic 12-month trend (deterministic from totals)
  const months = locale === "ar"
    ? ["ينا","فبر","مار","أبر","ماي","يون","يول","أغس","سبت","أكت","نوف","ديس"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const seedTrend = [62,68,71,76,82,79,86,91,89,94,97,collectionRate];
  const trendData = months.map((m,i) => {
    const potential = Math.round(monthlyPotential * (0.92 + i*0.008));
    const collected = Math.round(potential * (seedTrend[i]/100));
    return { m, potential, collected };
  });

  // Contract pipeline by month (new vs ending)
  const pipelineSeed = [[3,1],[4,2],[2,3],[5,2],[6,1],[4,3]];
  const pipelineData = months.slice(-6).map((m,i) => ({
    m, new: pipelineSeed[i][0], ending: pipelineSeed[i][1]
  }));

  // Portfolio mix
  const portfolioData = [
    { name: t.occupiedUnits || "Occupied", value: occupied, color: "var(--color-primary)" },
    { name: t.available, value: available, color: "#10B981" },
    { name: t.maintenance || "Maintenance", value: 1, color: "#F59E0B" },
  ];

  // Building leaderboard
  const buildingsRanked = D.buildings.map(b => {
    const us = D.units.filter(u => u.buildingId === b.id);
    const occ = us.filter(u => !u.available).length;
    const rev = us.reduce((s,u) => s + (!u.available ? u.rent : 0), 0);
    return { ...b, units: us.length, occ, occPct: us.length ? Math.round(occ/us.length*100) : 0, rev };
  }).sort((a,b) => b.rev - a.rev);

  // Activity stream — synthesized
  const activity = [
    { icon: "payments", kind: "success", txt: { en: <><b>Payment received</b> · A-101 · Abdullah Al-Shammari</>, ar: <><b>دفعة مستلمة</b> · A-101 · عبدالله الشمري</> }, when: { en: "2h ago", ar: "قبل ساعتين" }, amt: "+SAR 4,500" },
    { icon: "description", kind: "info", txt: { en: <><b>New contract signed</b> · B-204 · 12 month term</>, ar: <><b>عقد جديد</b> · B-204 · مدة 12 شهر</> }, when: { en: "5h ago", ar: "قبل 5 ساعات" }, amt: null },
    { icon: "warning", kind: "warning", txt: { en: <><b>Contract expiring</b> · A-202 · in 21 days</>, ar: <><b>عقد ينتهي</b> · A-202 · خلال 21 يوم</> }, when: { en: "Yesterday", ar: "أمس" }, amt: null },
    { icon: "build", kind: "info", txt: { en: <><b>Maintenance request</b> · Riyadh Tower A · A-G3</>, ar: <><b>طلب صيانة</b> · برج الرياض أ · A-G3</> }, when: { en: "Yesterday", ar: "أمس" }, amt: null },
    { icon: "error", kind: "danger", txt: { en: <><b>Payment overdue</b> · C-301 · 18 days</>, ar: <><b>دفعة متأخرة</b> · C-301 · 18 يوم</> }, when: { en: "2d ago", ar: "قبل يومين" }, amt: "−SAR 6,200" },
  ];

          </div>
          <div className="h-label">{t.collectionRate || "Collection rate"}</div>

            <div className="h-icon"><span className="ms">warning</span></div>
            <span className="h-trend down"><span className="ms">arrow_upward</span> {overdue.length}</span>
          </div>
          <div className="h-label">{t.overduePayments || "Overdue"}</div>
          <div className="h-value"><span className="currency">SAR</span>{window.formatSAR(overdueAmt)}</div>
          <div className="h-foot">{overdue.length} {locale === "ar" ? "دفعة متأخرة" : "payments past due"}</div>
          <div className="spark"><MiniSpark data={spark(overdueAmt)} color="#EF4444" /></div>
        </div>
      </div>

      {/* Charts row: revenue trend + portfolio donut */}

                <Area type="monotone" dataKey="collected" stroke="#7B1A1A" strokeWidth={2.2} fill="url(#g-col)" />

  const filtered = contracts.filter(c => {
    if (filter !== "all" && c.status !== filter) return false;
    if (search) {
      const s = search.toLowerCase();
      const tn = tenantOf(c.tenantId);
      if (!c.no.toLowerCase().includes(s) && !((tn?.nameEn || "").toLowerCase().includes(s))) return false;
    }
    return true;
  });

  const cycleAmount = form.rent * form.cycle;
  const installmentsPerYear = form.cycle === 3 ? 4 : form.cycle === 6 ? 2 : 1;
  const previewSchedule = Array.from({ length: installmentsPerYear }, (_, i) => {
    const d = new Date(form.start); d.setMonth(d.getMonth() + i * form.cycle);
    return { no: i + 1, due: d.toISOString().slice(0,10), amount: cycleAmount };
  });

  const handleCreate = () => {
    const newC = {
      id: "c" + Date.now(), no: form.no, unitId: form.unitId, tenantId: form.tenantId,
      rent: form.rent, cycle: form.cycle, start: form.start,
      end: (() => { const d = new Date(form.start); d.setFullYear(d.getFullYear()+1); return d.toISOString().slice(0,10); })(),
      status: "active",
    };
    setContracts([newC, ...contracts]);
    setDrawerOpen(false);
    addToast({ text: t.toastContractCreated, type: "success" });
  };

  const handleTerminate = () => {
    setContracts(contracts.map(c => c.id === confirmTerm.id ? { ...c, status: "terminated" } : c));
    setConfirmTerm(null);
    setOpenContractId(null);
    addToast({ text: t.toastContractTerminated, type: "warn" });
  };

  const detail = openContractId ? contracts.find(c => c.id === openContractId) : null;

  return (
    <div className="page screen-enter" key="contracts">
      <div className="page-header">
        <div>
          <h2 className="page-title">{t.contracts}</h2>
          <div className="page-subtitle">All lease agreements with tenants — active, expiring, terminated.</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn btn-secondary"><span className="ms">file_download</span> {t.export}</button>
          <button className="btn btn-primary" onClick={() => setDrawerOpen(true)}>
            <span className="ms">add</span> {t.newContract}
          </button>
        </div>
      </div>

      <div className="filter-bar">
        <div className="filter-tabs">
          {[{k:"all",l:t.all},{k:"active",l:t.active},{k:"expiring",l:t.expiring},{k:"expired",l:t.expired},{k:"terminated",l:t.terminated}].map(x => (
            <button key={x.k} className={"filter-tab" + (filter === x.k ? " active" : "")} onClick={() => setFilter(x.k)}>
              {x.l}<span className="count">{counts[x.k]}</span>
            </button>
          ))}
        </div>
        <div className="search-input">
          <span className="ms">search</span>
          <input placeholder={t.search + "…"} value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <button className="btn btn-secondary"><span className="ms">filter_list</span> {t.filter}</button>
      </div>

      <div className="card card-tight">
        <div className="tbl-wrap">
          <table className="tbl">
            <thead>
              <tr>
                <th>{t.contractNo}</th>
                <th>{t.tenant}</th>
                <th>{t.unit}</th>
                <th className="num">{t.rent}</th>
                <th>{t.cycle}</th>
                <th>{t.startDate}</th>
                <th>{t.endDate}</th>
                <th>{t.status}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const u = unitOf(c.unitId);
                const tn = tenantOf(c.tenantId);
                const b = buildingOf(u?.buildingId);
                const isExp = c.status === "expiring";
                return (
                  <tr key={c.id} className={isExp ? "warn-row" : ""}>
                    <td className="mono" style={{ fontSize: 12 }}>{c.no}</td>
                    <td>{locale === "ar" ? tn?.nameAr : tn?.nameEn}</td>
                    <td>
                      <div style={{ fontWeight: 500 }}>{u?.number}</div>
                      <div className="text-sec" style={{ fontSize: 11.5 }}>{locale === "ar" ? b?.nameAr : b?.nameEn}</div>
                    </td>
                    <td className="num">{window.formatSAR(c.rent)}</td>
                    <td><span className="badge badge-info">{c.cycle === 3 ? t.months3 : c.cycle === 6 ? t.months6 : t.months12}</span></td>
                    <td className="text-sec">{window.formatDate(c.start, locale)}</td>
                    <td className="text-sec">{window.formatDate(c.end, locale)}</td>
                    <td><window.StatusBadge status={c.status} t={t} /></td>
                    <td>
                      <div className="actions">
                        <button className="icon-btn" onClick={() => setOpenContractId(c.id)} title="View"><span className="ms ms-sm">visibility</span></button>
                        <button className="icon-btn" title="Edit"><span className="ms ms-sm">edit</span></button>
                        <button className="icon-btn" title="More"><span className="ms ms-sm">more_vert</span></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Create drawer */}
      <window.Drawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        title={t.newContract}
        sub="Generate a payment schedule from rent + cycle."
        footer={
          <React.Fragment>
            <button className="btn btn-ghost" onClick={() => setDrawerOpen(false)}>{t.cancel}</button>
            <button className="btn btn-primary" onClick={handleCreate}><span className="ms ms-sm">add</span> {t.create}</button>
          </React.Fragment>
        }
      >
        <div className="field-row">
          <div className="field">
            <label>{t.unit} <span className="req">*</span></label>
            <select className="select" value={form.unitId} onChange={e => {
              const u = D.units.find(x => x.id === e.target.value);
              setForm({...form, unitId: e.target.value, rent: u?.rent || form.rent });
            }}>
              {availableUnits.map(u => {
                const b = buildingOf(u.buildingId);
                return <option key={u.id} value={u.id}>{u.number} · {locale === "ar" ? b?.nameAr : b?.nameEn} (SAR {window.formatSAR(u.rent)})</option>;
              })}
            </select>
          </div>
          <div className="field">
            <label>{t.tenant} <span className="req">*</span></label>
            <select className="select" value={form.tenantId} onChange={e => setForm({...form, tenantId: e.target.value})}>
              {D.tenants.map(tn => <option key={tn.id} value={tn.id}>{locale === "ar" ? tn.nameAr : tn.nameEn}</option>)}
            </select>
          </div>
        </div>

        <div className="field-row">
          <div className="field">
            <label>{t.contractNo} <span className="req">*</span></label>
            <input className="input input-mono" value={form.no} onChange={e => setForm({...form, no: e.target.value})} />
          </div>
          <div className="field">
            <label>{t.startDate} <span className="req">*</span></label>
            <input className="input" type="date" value={form.start} onChange={e => setForm({...form, start: e.target.value})} />
          </div>
        </div>

        <div className="field">
          <label>{t.rentMonthly} <span className="req">*</span></label>
          <div className="input-with-prefix">
            <div className="prefix">SAR</div>
            <input className="input input-mono" type="number" value={form.rent} onChange={e => setForm({...form, rent: +e.target.value})} />
          </div>
        </div>

        <div className="field">
          <label>{t.cycle} <span className="req">*</span></label>
          <div className="radio-cards">
            {[3,6,12].map(c => (
              <div key={c} className={"radio-card" + (form.cycle === c ? " selected" : "")} onClick={() => setForm({...form, cycle: c})}>
                <div className="top">
                  <span className="lbl">{c === 3 ? t.months3 : c === 6 ? t.months6 : t.months12}</span>
                  <span className="check" />
                </div>
                <div className="sub">{installmentsPerYear === (c===3?4:c===6?2:1) ? "" : ""}{c === 3 ? "4" : c === 6 ? "2" : "1"} installments / yr</div>
                <div className="mono" style={{ marginTop: 4, fontWeight: 600, fontSize: 13, color: "var(--color-primary)" }}>SAR {window.formatSAR(form.rent * c)}</div>
                <div style={{ fontSize: 11, color: "var(--color-text-secondary)" }}>{t.perCycle}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="field">
          <label>{t.schedulePreview}</label>
          <div className="schedule">
            <div className="row head">
              <span>#</span>
              <span>{t.dueDate}</span>
              <span></span>
              <span></span>
              <span style={{ textAlign: "end" }}>{t.amount}</span>
            </div>
            {previewSchedule.map(s => (
              <div key={s.no} className="row">
                <span className="num">{s.no}</span>
                <span>{window.formatDate(s.due, locale)}</span>
                <span></span>
                <span className="badge badge-neutral">{t.pending}</span>
                <span className="num" style={{ textAlign: "end", fontWeight: 600 }}>SAR {window.formatSAR(s.amount)}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="field">
          <label>{t.notes}</label>
          <textarea className="textarea" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder="Optional…" />
        </div>
      </window.Drawer>

      {/* Contract detail drawer */}
      <window.Drawer
        open={!!detail}
        onClose={() => setOpenContractId(null)}
        width={620}
        title={detail ? detail.no : ""}
        sub={detail && (locale === "ar" ? tenantOf(detail.tenantId)?.nameAr : tenantOf(detail.tenantId)?.nameEn)}
        footer={detail && detail.status !== "terminated" && detail.status !== "expired" ? (
          <React.Fragment>
            <button className="btn btn-ghost" onClick={() => setOpenContractId(null)}>{t.cancel}</button>
            <button className="btn btn-danger" onClick={() => setConfirmTerm(detail)}>
              <span className="ms ms-sm">cancel</span> {t.terminate}
            </button>
          </React.Fragment>
        ) : null}
      >
        {detail && (() => {
          const u = unitOf(detail.unitId);
          const b = buildingOf(u?.buildingId);
          const o = ownerOf(b?.ownerId);
          const tn = tenantOf(detail.tenantId);
          const cycleAmt = detail.rent * detail.cycle;
          const ownerShare = cycleAmt - (cycleAmt * (u?.mgmtPct||0)/100) - (cycleAmt * (u?.agentPct||0)/100) - (u?.ejar||0);
          const installs = detail.cycle === 3 ? 4 : detail.cycle === 6 ? 2 : 1;
          const sched = Array.from({ length: installs }, (_, i) => {
            const d = new Date(detail.start); d.setMonth(d.getMonth() + i * detail.cycle);
            const dueDate = d.toISOString().slice(0,10);
            const today = new Date("2026-05-09");
            let status = d < today ? "paid" : "pending";
            if (i === installs - 1 && d < today) status = "overdue";
            return { no: i + 1, due: dueDate, amount: cycleAmt, status };
          });

          return (
            <React.Fragment>
              <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                <window.StatusBadge status={detail.status} t={t} />
                <span className="badge badge-info">{detail.cycle === 3 ? t.months3 : detail.cycle === 6 ? t.months6 : t.months12}</span>
                <span className="text-sec">{window.formatDate(detail.start, locale)} → {window.formatDate(detail.end, locale)}</span>
              </div>
              <div className="contract-panel">
                <div className="row">
                  <div className="item"><div className="lbl">{t.tenant}</div><div className="val">{locale === "ar" ? tn?.nameAr : tn?.nameEn}</div></div>
                  <div className="item"><div className="lbl">{t.unit}</div><div className="val">{u?.number} · {locale === "ar" ? b?.nameAr : b?.nameEn}</div></div>
                  <div className="item"><div className="lbl">{t.owner}</div><div className="val">{locale === "ar" ? o?.nameAr : o?.nameEn}</div></div>
                  <div className="item"><div className="lbl">{t.rent}</div><div className="val mono">SAR {window.formatSAR(detail.rent)}/mo</div></div>
                </div>
              </div>

              <h3 style={{ margin: "8px 0 6px", fontSize: 13.5 }}>{t.feeBreakdown}</h3>
              <div className="fee-table">
                <div className="lbl">{t.cycleAmount} ({detail.cycle}mo × SAR {window.formatSAR(detail.rent)})</div>
                <div className="val">SAR {window.formatSAR(cycleAmt)}</div>
                <div className="lbl">{t.mgmtFee} ({u?.mgmtPct}%)</div>
                <div className="val">−SAR {window.formatSAR(cycleAmt * (u?.mgmtPct||0)/100)}</div>
                <div className="lbl">{t.agentFee} ({u?.agentPct}%)</div>
                <div className="val">−SAR {window.formatSAR(cycleAmt * (u?.agentPct||0)/100)}</div>
                <div className="lbl">{t.ejarFee}</div>
                <div className="val">−SAR {window.formatSAR(u?.ejar||0)}</div>
                <div className="lbl total">{t.ownerShare}</div>
                <div className="val total">SAR {window.formatSAR(ownerShare)}</div>
              </div>

              <h3 style={{ margin: "8px 0 6px", fontSize: 13.5 }}>{t.paymentSchedule}</h3>
              <div className="schedule">
                <div className="row head">
                  <span>#</span>
                  <span>{t.dueDate}</span>
                  <span></span>
                  <span></span>
                  <span style={{ textAlign: "end" }}>{t.amount}</span>
                </div>
                {sched.map(s => (
                  <div key={s.no} className="row">
                    <span className="num">{s.no}</span>
                    <span>{window.formatDate(s.due, locale)}</span>
                    <span></span>
                    <span><window.StatusBadge status={s.status} t={t} /></span>
                    <span className="num" style={{ textAlign: "end", fontWeight: 600 }}>SAR {window.formatSAR(s.amount)}</span>
                  </div>
                ))}
              </div>
            </React.Fragment>
          );
        })()}
      </window.Drawer>

      {/* Terminate confirm modal */}
      <window.Modal
        open={!!confirmTerm}
        onClose={() => setConfirmTerm(null)}
        title={t.confirmTerminate}
        sub={confirmTerm?.no}
        footer={
          <React.Fragment>
            <button className="btn btn-ghost" onClick={() => setConfirmTerm(null)}>{t.cancel}</button>
            <button className="btn btn-primary" style={{ background: "var(--color-danger)", borderColor: "var(--color-danger)" }} onClick={handleTerminate}>
              <span className="ms ms-sm">cancel</span> {t.terminate}
            </button>
          </React.Fragment>
        }
      >
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--color-danger-soft)", color: "var(--color-danger)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <span className="ms">warning</span>
          </div>
          <div style={{ fontSize: 13, lineHeight: 1.5, color: "var(--color-text-secondary)" }}>{t.confirmTerminateBody}</div>
        </div>
      </window.Modal>
    </div>
  );
};

</script>

<script type="text/babel">
// Payments — modern card grid with mark-paid modal and split summary
window.PaymentsScreen = function PaymentsScreen() {
  const { locale, MOCK, addToast } = window.useApp();
  const t = window.useT(locale);
  const D = MOCK;

  const [filter, setFilter] = React.useState("all");
  const [search, setSearch] = React.useState("");
  const [view, setView] = React.useState("grid");
  const [payments, setPayments] = React.useState(D.payments);
  const [markOpen, setMarkOpen] = React.useState(null);
  const [markForm, setMarkForm] = React.useState({ method: "bank", receipt: "RCP-" + Math.floor(Math.random()*9000+1000), date: "2026-05-09", notes: "" });

  const tenantOf = id => D.tenants.find(x => x.id === id);
  const unitOf = id => D.units.find(u => u.id === id);
  const buildingOf = id => D.buildings.find(b => b.id === id);
  const contractOf = id => D.contracts.find(c => c.id === id);

  const counts = {
    all: payments.length,
    pending: payments.filter(p => p.status === "pending").length,
    paid: payments.filter(p => p.status === "paid").length,
    overdue: payments.filter(p => p.status === "overdue").length,
  };

  const totalDue = payments.filter(p => p.status !== "paid").reduce((s,p) => s + p.amount, 0);
  const totalPaid = payments.filter(p => p.status === "paid").reduce((s,p) => s + p.amount, 0);
  const totalOverdue = payments.filter(p => p.status === "overdue").reduce((s,p) => s + p.amount, 0);

  const filtered = payments.filter(p => {
    if (filter !== "all" && p.status !== filter) return false;
    if (search) {
      const s = search.toLowerCase();
      const c = contractOf(p.contractId);
      const tn = tenantOf(c?.tenantId);
      if (!((tn?.nameEn || "").toLowerCase().includes(s)) && !((c?.no || "").toLowerCase().includes(s))) return false;
    }
    return true;
  }).sort((a,b) => new Date(a.due) - new Date(b.due));

  const handleMark = () => {
    setPayments(payments.map(p => p.id === markOpen.id
      ? { ...p, status: "paid", paidDate: markForm.date, method: markForm.method, daysOverdue: 0 }
      : p));
    setMarkOpen(null);
    addToast({ text: t.toastPaymentMarked, type: "success" });
  };

  const splitFor = (pmt) => {
    const c = contractOf(pmt.contractId);
    const u = unitOf(c?.unitId);
    if (!u) return null;
    const total = pmt.amount;
    const mgmt = total * (u.mgmtPct||0)/100;
    const agent = total * (u.agentPct||0)/100;
    const ejar = u.ejar || 0;
    const owner = total - mgmt - agent - ejar;
    return { total, mgmt, agent, ejar, owner, mgmtPct: u.mgmtPct, agentPct: u.agentPct };
  };

  const statusColor = {
    paid: "#10B981",
    pending: "#F59E0B",
    overdue: "#EF4444",
  };
  const statusIcon = {
    paid: "task_alt",
    pending: "schedule",
    overdue: "error",
  };

  return (
    <div className="page screen-enter" key="payments">
      <div className="page-header">
        <div>
          <h2 className="page-title">{t.payments}</h2>
          <div className="page-subtitle">{locale === "ar" ? "تتبع الأقساط المستحقة والمدفوعة والمتأخرة عبر المحفظة." : "Track due, paid, and overdue installments across the portfolio."}</div>
        </div>
        <button className="btn btn-secondary"><span className="ms">file_download</span> {t.export}</button>
      </div>

      <div className="kpi-grid" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
        <window.KPICard icon="receipt_long" label={locale === "ar" ? "إجمالي الأقساط" : "Total installments"} value={payments.length} />
        <window.KPICard icon="task_alt" label={locale === "ar" ? "محصّل" : "Collected"} value={"SAR " + window.formatSAR(totalPaid)} variant="success" />
        <window.KPICard icon="schedule" label={locale === "ar" ? "مستحق" : "Outstanding"} value={"SAR " + window.formatSAR(totalDue)} />
        <window.KPICard icon="error" label={locale === "ar" ? "متأخر" : "Overdue"} value={"SAR " + window.formatSAR(totalOverdue)} variant="danger" />
      </div>

      <div className="filter-bar">
        <div className="filter-tabs">
          {[{k:"all",l:t.all},{k:"pending",l:t.pending},{k:"paid",l:t.paid},{k:"overdue",l:t.overdue}].map(x => (
            <button key={x.k} className={"filter-tab" + (filter === x.k ? " active" : "")} onClick={() => setFilter(x.k)}>
              {x.l}<span className="count">{counts[x.k]}</span>
            </button>
          ))}
        </div>
        <div className="search-input">
          <span className="ms">search</span>
          <input placeholder={t.search + "…"} value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <button className="btn btn-secondary"><span className="ms">filter_list</span> {t.filter}</button>
        <div style={{ marginInlineStart: "auto" }} />
        <div className="view-toggle">
          <button className={"vt-btn" + (view === "grid" ? " active" : "")} onClick={() => setView("grid")} title="Grid"><span className="ms ms-sm">grid_view</span></button>
          <button className={"vt-btn" + (view === "list" ? " active" : "")} onClick={() => setView("list")} title="List"><span className="ms ms-sm">view_list</span></button>
        </div>
      </div>

      {view === "grid" ? (
        <div className="pmt-grid">
          {filtered.map(p => {
            const c = contractOf(p.contractId);
            const u = unitOf(c?.unitId);
            const tn = tenantOf(c?.tenantId);
            const b = u ? buildingOf(u.buildingId) : null;
            const sc = statusColor[p.status];
            const initials = tn ? tn.nameEn.split(" ").map(w=>w[0]).slice(0,2).join("") : "?";
            const dueDate = new Date(p.due);
            const today = new Date("2026-05-09");
            const daysFromNow = Math.round((dueDate - today) / 86400000);
            return (
              <div key={p.id} className="pmt-card" data-status={p.status}>
                <div className="pmt-card-rail" style={{ background: sc }} />
                <div className="pmt-card-hd">
                  <div className="pmt-card-avatar" style={{ background: `linear-gradient(135deg, ${sc}, ${sc}cc)` }}>{initials}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="pmt-card-tenant">{locale === "ar" ? tn?.nameAr : tn?.nameEn}</div>
                    <div className="pmt-card-unit">
                      <span className="ms ms-sm">apartment</span>
                      <span style={{ fontWeight: 500 }}>{u?.number}</span>
                      <span className="text-sec">·</span>
                      <span className="text-sec" style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{locale === "ar" ? b?.nameAr : b?.nameEn}</span>
                    </div>
                  </div>
                  <span className="pmt-card-status" style={{ background: sc + "1A", color: sc }}>
                    <span className="ms ms-sm">{statusIcon[p.status]}</span>
                    {p.status === "paid" ? t.paid : p.status === "overdue" ? t.overdue : t.pending}
                  </span>
                </div>

                <div className="pmt-card-amt">
                  <div className="pmt-card-amt-l">
                    <div className="pmt-card-amt-lbl">{t.amount}</div>
                    <div className="pmt-card-amt-num">SAR {window.formatSAR(p.amount)}</div>
                  </div>
                  <div className="pmt-card-amt-r">
                    <div className="pmt-card-amt-lbl">{t.dueDate}</div>
                    <div className="pmt-card-due">{window.formatDate(p.due, locale)}</div>
                    {p.status === "overdue" ? (
                      <div className="pmt-card-due-sub" style={{ color: sc }}>{p.daysOverdue}{locale === "ar" ? " يوم متأخر" : "d overdue"}</div>
                    ) : p.status === "pending" ? (
                      <div className="pmt-card-due-sub text-sec">{daysFromNow >= 0 ? (locale === "ar" ? `بعد ${daysFromNow} يوم` : `in ${daysFromNow}d`) : ""}</div>
                    ) : (
                      <div className="pmt-card-due-sub text-sec">{locale === "ar" ? "دُفع في" : "paid"} {window.formatDate(p.paidDate || p.due, locale)}</div>
                    )}
                  </div>
                </div>

                <div className="pmt-card-meta">
                  <span className="pmt-meta-chip">
                    <span className="ms ms-sm">tag</span>
                    <span className="mono">{c?.no}</span>
                  </span>
                  <span className="pmt-meta-chip">

  };

                    <div className="role-name">
                      {locale === "ar" ? r.labelAr : r.labelEn}
                      {r.system && <span className="role-system">{locale === "ar" ? "نظام" : "System"}</span>}
                    </div>
                    <div className="role-count">{count} {locale === "ar" ? "مستخدم" : count === 1 ? "user" : "users"}</div>
                  </div>
                </button>
              );
            })}
          </div>

          <div className="role-detail">
            {(() => {
              const r = roleOf(selectedRole);
              if (!r) return null;
              const totalCells = D.modules.length * PERMS.length;
              const grantedCells = D.modules.reduce((sum, m) => {
                const p = r.perms[m.id] || {};
                return sum + PERMS.reduce((s, k) => s + (p[k] ? 1 : 0), 0);
              }, 0);
              const pct = Math.round((grantedCells / totalCells) * 100);
              return (
                <>
                  <div className="card role-hero">
                    <div className="role-hero-main">
                      <div className="role-hero-swatch" style={{ background: `linear-gradient(135deg, ${r.color}, ${r.color}cc)`, boxShadow: `0 8px 24px -10px ${r.color}80` }}>
                        <span className="ms" style={{ fontSize: 28, color: "#fff" }}>{r.id === "admin" ? "shield" : r.id === "manager" ? "supervisor_account" : r.id === "accountant" ? "calculate" : r.id === "agent" ? "handshake" : r.id === "viewer" ? "visibility" : "key"}</span>
                      </div>
                      <div style={{ flex: 1 }}>
                        <div className="role-hero-title">
                          {locale === "ar" ? r.labelAr : r.labelEn}
                          {r.system && <span className="role-system">{locale === "ar" ? "نظام" : "System role"}</span>}
                        </div>
                        <div className="role-hero-desc">{locale === "ar" ? r.descAr : r.descEn}</div>
                      </div>
                      <div className="role-hero-stats">
                        <div className="rh-stat">
                          <div className="rh-num" style={{ color: r.color }}>{users.filter(u => u.role === r.id).length}</div>
                          <div className="rh-lbl">{locale === "ar" ? "مستخدم" : "Users"}</div>
                        </div>
                        <div className="rh-stat">
                          <div className="rh-num" style={{ color: r.color }}>{pct}%</div>
                          <div className="rh-lbl">{locale === "ar" ? "صلاحيات" : "Granted"}</div>
                        </div>
                      </div>
                    </div>
                    <div className="role-coverage">
                      <div className="role-coverage-bar"><div style={{ width: `${pct}%`, background: r.color }} /></div>
                    </div>
                  </div>

                  <div className="card card-tight">
                    <div className="perm-hd">
                      <div>
                        <div style={{ fontWeight: 600 }}>{locale === "ar" ? "مصفوفة الصلاحيات" : "Permission matrix"}</div>
                        <div className="text-sec" style={{ fontSize: 12 }}>{locale === "ar" ? "اضغط على الخلية لتفعيل/تعطيل الصلاحية" : "Click a cell to toggle access"}</div>
                      </div>
                      {r.system && (
                        <div className="lock-hint"><span className="ms ms-sm">lock</span> {locale === "ar" ? "دور نظام — للعرض فقط" : "System role — read only"}</div>
                      )}
                    </div>
                    <div className="perm-matrix">
                      <table className="tbl perm-tbl">
                        <thead>
                          <tr>
                            <th style={{ width: 220 }}>{locale === "ar" ? "الوحدة" : "Module"}</th>
                            {PERMS.map(k => <th key={k} style={{ textAlign: "center" }}>{PERM_LABELS[k]}</th>)}
                            <th style={{ width: 90, textAlign: "center" }}>{locale === "ar" ? "الكل" : "All"}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {D.modules.map(m => {
                            const p = r.perms[m.id] || {};
                            const granted = PERMS.filter(k => p[k]).length;
                            const all = granted === PERMS.length;
                            return (
                              <tr key={m.id}>
                                <td>
                                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                    <span className="ms" style={{ color: r.color }}>{m.icon}</span>
                                    <div>
                                      <div style={{ fontWeight: 500 }}>{locale === "ar" ? m.labelAr : m.labelEn}</div>
                                      <div className="text-sec" style={{ fontSize: 11 }}>{granted}/{PERMS.length} {locale === "ar" ? "ممنوحة" : "granted"}</div>
                                    </div>
                                  </div>
                                </td>
                                {PERMS.map(k => {
                                  const on = !!p[k];
                                  return (
                                    <td key={k} style={{ textAlign: "center" }}>
                                      <button
                                        className={"perm-cell" + (on ? " on" : "")}
                                        disabled={r.system}
                                        onClick={() => !r.system && togglePerm(r.id, m.id, k)}
                                        style={on ? { background: r.color + "1F", color: r.color, borderColor: r.color + "55" } : {}}
                                        aria-label={`${PERM_LABELS[k]} ${m.labelEn}`}
                                      >
                                        <span className="ms ms-sm">{on ? "check" : "remove"}</span>
                                      </button>
                                    </td>
                                  );
                                })}
                                <td style={{ textAlign: "center" }}>
                                  <window.Toggle on={all} onChange={(v) => {
                                    if (r.system) return;
                                    setRoles(roles.map(rr => rr.id === r.id ? {
                                      ...rr,
                                      perms: { ...rr.perms, [m.id]: PERMS.reduce((acc, kk) => ({ ...acc, [kk]: v ? 1 : 0 }), {}) },
                                    } : rr));
                                  }} />
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
};

</script>

<script type="text/babel">
// Main app
const { useState: useStateApp, useEffect: useEffectApp } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#7B1A1A",
  "dark": false
}/*EDITMODE-END*/;

function MuktasabatApp() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const params = new URLSearchParams(window.location.search);
  const [authed, setAuthed] = useStateApp(params.get("auth") !== "0");
  const [route, setRoute] = useStateApp(params.get("route") || "dashboard");
  const [locale, setLocale] = useStateApp(params.get("locale") === "ar" ? "ar" : "en");
  const [collapsed, setCollapsed] = useStateApp(false);
  const [openContractId, setOpenContractId] = useStateApp(null);
  const [toasts, setToasts] = useStateApp([]);

  // theme
  const theme = t.dark ? "dark" : "light";

  // apply locale + theme + primary on document
  useEffectApp(() => {
    document.documentElement.setAttribute("dir", locale === "ar" ? "rtl" : "ltr");
    document.documentElement.setAttribute("lang", locale);
  }, [locale]);

  useEffectApp(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffectApp(() => {
    const root = document.documentElement.style;
    root.setProperty("--color-primary", t.primaryColor);
    // derive variants
    const c = t.primaryColor;
    root.setProperty("--color-primary-soft", c + "14"); // ~8% alpha hex
    root.setProperty("--color-primary-softer", c + "0a");
  }, [t.primaryColor]);

  const addToast = (toast) => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, ...toast }]);
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== id)), 4500);
  };

  const openContractFor = (id) => {
    setRoute("contracts");
    setTimeout(() => setOpenContractId(id), 80);
  };

  const ctx = {
    locale, setLocale, route, setRoute, MOCK: window.MOCK, theme,
    openContractId, setOpenContractId, openContractFor, addToast,
  };

  if (!authed) {
    return (
      <window.AppCtx.Provider value={ctx}>
        <window.LoginScreen onLogin={() => { setAuthed(true); addToast({ text: window.useT(locale).toastWelcome, type: "success" }); }} locale={locale} setLocale={setLocale} />
        <window.Toasts toasts={toasts} />
        <Tweaks t={t} setTweak={setTweak} />
      </window.AppCtx.Provider>
    );
  }

  let Screen = null;
  switch (route) {
    case "dashboard": Screen = window.DashboardScreen; break;
    case "properties": Screen = window.PropertiesScreen; break;
    case "owners": Screen = window.OwnersScreen; break;
    case "tenants": Screen = window.TenantsScreen; break;
    case "contracts": Screen = window.ContractsScreen; break;
    case "payments": Screen = window.PaymentsScreen; break;
    case "expenses": Screen = window.ExpensesScreen; break;
    case "users": Screen = window.AdminScreen; break;
    default: Screen = window.DashboardScreen;
  }

  return (
    <window.AppCtx.Provider value={ctx}>
      <div className={"app" + (collapsed ? " collapsed" : "")}>
        <window.Sidebar
          collapsed={collapsed} setCollapsed={setCollapsed}
          route={route} setRoute={setRoute}
          locale={locale} setLocale={setLocale}
        />
        <div className="main">
          <window.Topbar route={route} locale={locale} setLocale={setLocale}
            theme={theme} setTheme={(v) => setTweak("dark", v === "dark")}
            onLogout={() => setAuthed(false)} />
          <Screen />
        </div>
      </div>
      <window.Toasts toasts={toasts} />
      <Tweaks t={t} setTweak={setTweak} />
    </window.AppCtx.Provider>
  );
}

function Tweaks({ t, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Theme" />
      <TweakToggle label="Dark mode" value={t.dark} onChange={v => setTweak("dark", v)} />
      <TweakSection label="Brand color" />
      <TweakColor label="Primary"
        value={t.primaryColor}
        options={["#7B1A1A", "#0F4C81", "#1F8A5B", "#2A2A2A", "#7A5AE0", "#CA8A04"]}
        onChange={v => setTweak("primaryColor", v)} />
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MuktasabatApp />);

</script>

</body>
</html>
